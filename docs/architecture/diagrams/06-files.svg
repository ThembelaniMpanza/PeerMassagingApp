<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="06-files-title 06-files-desc"><title id="06-files-title">06 / File transfer</title><desc id="06-files-desc">Example: 156,000 bytes = four chunks; all content is buffered in memory in the current implementation.</desc><defs><marker id="06-files-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="1060" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">06 / File transfer</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Example: 156,000 bytes = four chunks; all content is buffered in memory in the current implementation.</text><rect x="110" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="128" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Sending device</text><line x1="260" y1="170" x2="260" y2="1015" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="790" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="808" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Receiving device</text><line x1="940" y1="170" x2="940" y2="1015" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="90" y="188" width="340" height="57" rx="7" fill="#fff1d6"/><text x="260" y="210" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Pick file; read bytes; SHA-256</text><text x="260" y="232" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Maximum 10 MiB; chunks of 49,152 bytes</text><path d="M260,319 L940,319" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="297" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">FILE_OFFER</text><text x="600" y="343" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Name, MIME, size, count, chunkSize and hash</text><rect x="770" y="362" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="384" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">User chooses Accept / Decline</text><text x="940" y="406" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">No file bytes should flow before acceptance</text><path d="M940,493 L260,493" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="471" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">FILE_ACCEPT</text><text x="600" y="517" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">resumeFromChunk = 0</text><path d="M260,580 L940,580" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="558" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">FILE_CHUNK × N</text><text x="600" y="604" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Binary → base64 text → AES-GCM → base64 ciphertext</text><rect x="770" y="623" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="645" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Decrypt each chunk; validate size and hash</text><text x="940" y="667" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Retain chunks; update progress</text><path d="M260,754 L940,754" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="732" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">FILE_COMPLETE</text><text x="600" y="778" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">End of content with whole-file SHA-256</text><rect x="770" y="797" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="819" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Reassemble and verify whole file</text><text x="940" y="841" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Windows saves before ACK; mobile save is async</text><path d="M940,928 L260,928" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="906" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">FILE_COMPLETE acknowledgement</text><text x="600" y="952" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Sender now marks completed</text><path d="M260,1015 L940,1015" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#06-files-arrow)"/><text x="600" y="993" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">Alternative: REJECT / CANCEL / ERROR</text><text x="600" y="1039" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Inactivity timeout: 60 seconds; resend interrupted file</text><text x="32" y="1042" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>