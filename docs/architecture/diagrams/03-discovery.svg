<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="03-discovery-title 03-discovery-desc"><title id="03-discovery-title">03 / Discovery and emulator routes</title><desc id="03-discovery-desc">A discovery sighting is a reachability hint, not an authenticated identity.</desc><defs><marker id="03-discovery-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="710" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">03 / Discovery and emulator routes</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">A discovery sighting is a reachability hint, not an authenticated identity.</text><rect x="35" y="120" width="350" height="175" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="151" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Phone broadcasts</text><text x="53" y="180" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Destination: 255.255.255.255:5051</text><text x="53" y="205" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">JSON: service, version, ID, name,</text><text x="53" y="230" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">platform and TCP port</text><text x="53" y="255" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Every 5 seconds</text><rect x="815" y="120" width="350" height="175" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="833" y="151" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">PC receives / advertises</text><text x="833" y="180" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Use UDP source address as peer IP</text><text x="833" y="205" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Validate datagram and update list</text><text x="833" y="230" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">16-second nearby window</text><text x="833" y="255" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Connect to advertised TCP port</text><path d="M395,180 L805,180" stroke="#557e70" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#03-discovery-arrow)"/><text x="600" y="170" font-size="15" fill="#46574f" font-weight="500" text-anchor="middle">UDP broadcast on the same LAN</text><path d="M805,250 L395,250" stroke="#557e70" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#03-discovery-arrow)"/><text x="600" y="240" font-size="15" fill="#46574f" font-weight="500" text-anchor="middle">Both devices advertise</text><rect x="35" y="390" width="530" height="190" rx="14" fill="#fff1d6" stroke="#9eb8ad"/><text x="53" y="421" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Emulator → desktop</text><text x="53" y="450" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Mobile manual address: 10.0.2.2:5050</text><text x="53" y="475" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Emulator virtual gateway routes to host TCP</text><text x="53" y="500" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Ordinary LAN broadcasts may not cross NAT</text><text x="53" y="525" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Physical phone uses actual PC Wi-Fi IPv4</text><rect x="635" y="390" width="530" height="190" rx="14" fill="#fff1d6" stroke="#9eb8ad"/><text x="653" y="421" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Desktop → emulator</text><text x="653" y="450" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">adb forward tcp:15050 tcp:5050</text><text x="653" y="475" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Desktop manual address: 127.0.0.1:15050</text><text x="653" y="500" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">ADB routes host port to emulator listener</text><text x="653" y="525" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Forwarding is test infrastructure, not app code</text><text x="600" y="640" font-size="18" fill="#63736b" font-weight="500" text-anchor="middle">Firewall, guest-network isolation and Wi-Fi filtering can prevent discovery or connection</text><text x="32" y="692" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>