<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="04-pairing-title 04-pairing-desc"><title id="04-pairing-title">04 / Pairing sequence</title><desc id="04-pairing-desc">Simplified after TCP handshake. Manual approval is not a complete authenticated-channel protocol.</desc><defs><marker id="04-pairing-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="886" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">04 / Pairing sequence</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Simplified after TCP handshake. Manual approval is not a complete authenticated-channel protocol.</text><rect x="110" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="128" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Initiating device</text><line x1="260" y1="170" x2="260" y2="841" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="790" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="808" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Receiving device</text><line x1="940" y1="170" x2="940" y2="841" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="90" y="188" width="340" height="57" rx="7" fill="#fff1d6"/><text x="260" y="210" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Generate P-256 pair + six-digit code</text><text x="260" y="232" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Fingerprint = SHA-256 of public JWK JSON</text><path d="M260,319 L940,319" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#04-pairing-arrow)"/><text x="600" y="297" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">PAIR_REQUEST</text><text x="600" y="343" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Code, identity, public key and fingerprint are plaintext</text><rect x="770" y="362" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="384" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">User compares fingerprint and types code</text><text x="940" y="406" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Explicit consent; decline sends PAIR_REJECT</text><rect x="770" y="449" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="471" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Generate key pair; derive raw secret</text><text x="940" y="493" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">32-byte ECDH X coordinate → AES key</text><path d="M940,580 L260,580" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#04-pairing-arrow)"/><text x="600" y="558" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">PAIR_ACCEPT</text><text x="600" y="604" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Responder public key/fingerprint and echoed code</text><rect x="90" y="623" width="340" height="57" rx="7" fill="#fff1d6"/><text x="260" y="645" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Validate pending response; derive same key</text><text x="260" y="667" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">No HKDF, ratchet or fresh reconnect exchange</text><path d="M260,754 L940,754" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#04-pairing-arrow)"/><text x="600" y="732" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">Encrypted messages and file chunks</text><text x="600" y="778" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">AES-256-GCM • random 12-byte IV • appended 16-byte tag</text><rect x="770" y="797" width="340" height="57" rx="7" fill="#fff1d6"/><text x="940" y="819" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Persist key for later connections</text><text x="940" y="841" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">SecureStore on mobile; DPAPI on Windows</text><text x="32" y="868" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>