<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="01-system-title 01-system-desc"><title id="01-system-title">01 / System context</title><desc id="01-system-desc">Active peers communicate directly. Other implementations are separate products in the same repository.</desc><defs><marker id="01-system-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="620" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">01 / System context</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Active peers communicate directly. Other implementations are separate products in the same repository.</text><rect x="35" y="120" width="380" height="190" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="151" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Android phone / Expo</text><text x="53" y="180" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">React Native UI + MobileRuntime</text><text x="53" y="205" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Shared TypeScript domain services</text><text x="53" y="230" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Native TCP + UDP + platform storage</text><text x="53" y="255" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Both client and listening server</text><rect x="785" y="120" width="380" height="190" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="803" y="151" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Windows PC / WPF</text><text x="803" y="180" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">XAML UI + C# PeerService</text><text x="803" y="205" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">.NET sockets and cryptography</text><text x="803" y="230" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">JSON history + DPAPI-protected keys</text><text x="803" y="255" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Both client and listening server</text><path d="M425,180 L775,180" stroke="#557e70" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#01-system-arrow)"/><text x="600" y="170" font-size="15" fill="#46574f" font-weight="500" text-anchor="middle">UDP 5051 / discovery</text><path d="M775,250 L425,250" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#01-system-arrow)"/><text x="600" y="240" font-size="15" fill="#46574f" font-weight="500" text-anchor="middle">TCP 5050 / JSON + encrypted content</text><rect x="35" y="395" width="530" height="140" rx="14" fill="#edf0f2" stroke="#9eb8ad"/><text x="53" y="426" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Electron prototype</text><text x="53" y="455" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">React DOM + Node sockets + IPC bridge</text><text x="53" y="480" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Shared TypeScript; sample discovery</text><rect x="635" y="395" width="530" height="140" rx="14" fill="#edf0f2" stroke="#9eb8ad"/><text x="653" y="426" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Flutter prototype</text><text x="653" y="455" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Dart / Material UI + SQLite</text><text x="653" y="480" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Sample devices; local chat persistence</text><text x="600" y="352" font-size="19" fill="#173b35" font-weight="600" text-anchor="middle">No central server, cloud queue or internet relay in the active path</text><text x="32" y="602" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>