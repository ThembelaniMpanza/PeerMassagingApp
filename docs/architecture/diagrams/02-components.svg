<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="02-components-title 02-components-desc"><title id="02-components-title">02 / Process components</title><desc id="02-components-desc">Code sharing stops at TypeScript; Windows interoperates through the protocol, not a JavaScript runtime.</desc><defs><marker id="02-components-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="770" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">02 / Process components</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Code sharing stops at TypeScript; Windows interoperates through the protocol, not a JavaScript runtime.</text><rect x="35" y="115" width="520" height="105" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Mobile UI / App.tsx</text><text x="53" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Hooks, selected peer, pairing input, chat, transfer controls</text><rect x="645" y="115" width="520" height="105" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="663" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Windows UI / MainWindow</text><text x="663" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">XAML templates, code-behind, Dispatcher, tray</text><path d="M295,225 L295,260" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#02-components-arrow)"/><path d="M905,225 L905,260" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#02-components-arrow)"/><rect x="35" y="270" width="520" height="135" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="301" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">MobileRuntime</text><text x="53" y="330" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">PairingCoordinator + MessageService</text><text x="53" y="355" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">FileTransferService + LocalPeerConnectionManager</text><text x="53" y="380" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Events produce immutable UI snapshots</text><rect x="645" y="270" width="520" height="135" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="663" y="301" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">PeerService + PeerService.Files</text><text x="663" y="330" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">C# pairing, messages, transfers and maintenance</text><text x="663" y="355" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Concurrent dictionaries, semaphores, cancellation</text><text x="663" y="380" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Events produce UI collection snapshots</text><path d="M295,410 L295,455" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#02-components-arrow)"/><path d="M905,410 L905,455" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#02-components-arrow)"/><rect x="35" y="465" width="520" height="160" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="496" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Platform adapters</text><text x="53" y="525" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">MobileSocket / react-native-tcp-socket</text><text x="53" y="550" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">LanDiscovery / react-native-udp</text><text x="53" y="575" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Noble + expo-crypto; SecureStore + AsyncStorage</text><rect x="645" y="465" width="520" height="160" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="663" y="496" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Built-in .NET / Windows APIs</text><text x="663" y="525" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">TcpClient / TcpListener / UdpClient</text><text x="663" y="550" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">ECDiffieHellman / AesGcm / SHA256</text><text x="663" y="575" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">System.Text.Json / file APIs / ProtectedData</text><text x="600" y="692" font-size="20" fill="#173b35" font-weight="600" text-anchor="middle">Common contract: UTF-8 JSON + LF, event payloads, JWK keys, AES-GCM bytes</text><text x="32" y="752" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>