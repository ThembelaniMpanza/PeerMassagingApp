<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="08-builds-title 08-builds-desc"><title id="08-builds-title">08 / From source to executable</title><desc id="08-builds-desc">Build-time tooling is separate from runtime network communication.</desc><defs><marker id="08-builds-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="900" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">08 / From source to executable</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Build-time tooling is separate from runtime network communication.</text><rect x="35" y="115" width="530" height="110" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Windows source</text><text x="53" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">C# + XAML + SDK-style .csproj</text><text x="53" y="200" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Target: net10.0-windows / win-x64</text><rect x="635" y="115" width="530" height="110" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="653" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Android source</text><text x="653" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">TypeScript + React Native + Expo app.json</text><text x="653" y="200" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Native Kotlin project generated by Expo prebuild</text><path d="M300,232 L300,265" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><path d="M900,232 L900,265" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><rect x="35" y="275" width="530" height="130" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="306" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">.NET SDK / MSBuild</text><text x="53" y="335" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Compile C# and XAML resources</text><text x="53" y="360" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Framework references: WPF + Windows Forms</text><text x="53" y="385" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">No declared third-party NuGet PackageReference</text><rect x="635" y="275" width="530" height="130" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="653" y="306" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Metro + Babel + Hermes</text><text x="653" y="335" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Resolve mobile entry and shared workspaces</text><text x="653" y="360" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Bundle JavaScript; compile Hermes bytecode</text><text x="653" y="385" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Autolink native TCP, UDP, storage and file modules</text><path d="M300,410 L300,445" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><path d="M900,410 L900,445" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><rect x="35" y="455" width="530" height="140" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="486" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">dotnet publish</text><text x="53" y="515" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Release + self-contained + single-file</text><text x="53" y="540" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Bundle managed app + Windows desktop runtime</text><text x="53" y="565" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Native libraries may extract when launched</text><rect x="635" y="455" width="530" height="140" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="653" y="486" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Gradle + Android toolchain</text><text x="653" y="515" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Kotlin/Java → DEX; C++ via NDK/CMake</text><text x="653" y="540" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Merge manifest/resources; release checks</text><text x="653" y="565" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Package and sign test APK</text><path d="M300,600 L300,635" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><path d="M900,600 L900,635" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#08-builds-arrow)"/><rect x="35" y="645" width="530" height="150" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="676" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">IPMessenger.exe</text><text x="53" y="705" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">apps/windows-native/publish</text><text x="53" y="730" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Runs without Node, Electron or Metro</text><text x="53" y="755" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Windows x64; not NativeAOT</text><rect x="635" y="645" width="530" height="150" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="653" y="676" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">IP-Messenger-1.0.0-android.apk</text><text x="653" y="705" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">.artifacts / approximately 35.2 MiB</text><text x="653" y="730" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">arm64-v8a + x86_64; minimum Android API 24</text><text x="653" y="755" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Embedded bundle; test-key signed; no Metro needed</text><text x="32" y="882" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>