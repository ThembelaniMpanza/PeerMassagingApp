<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="799" viewBox="0 0 1200 799" role="img" aria-labelledby="05-messages-title 05-messages-desc"><title id="05-messages-title">05 / Message delivery</title><desc id="05-messages-desc">Socket write, recipient delivery and UI read state are different milestones.</desc><defs><marker id="05-messages-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="799" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">05 / Message delivery</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Socket write, recipient delivery and UI read state are different milestones.</text><rect x="35" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Sender UI / store</text><line x1="185" y1="170" x2="185" y2="754" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="450" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="468" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">TCP connection</text><line x1="600" y1="170" x2="600" y2="754" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="865" y="102" width="300" height="63" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="883" y="133" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Receiver UI / store</text><line x1="1015" y1="170" x2="1015" y2="754" stroke="#aebdb4" stroke-dasharray="5 5"/><rect x="15" y="188" width="340" height="57" rx="7" fill="#fff1d6"/><text x="185" y="210" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Create message → queued</text><text x="185" y="232" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Trim text; assign ID; persist locally</text><path d="M185,319 L600,319" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#05-messages-arrow)"/><text x="392.5" y="297" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">MESSAGE: encrypted body</text><text x="392.5" y="343" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">queued → sending → sent on socket write</text><path d="M600,406 L1015,406" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#05-messages-arrow)"/><text x="807.5" y="384" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">Validate identity, decrypt and deduplicate</text><text x="807.5" y="430" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Store plaintext history; display incoming message</text><path d="M1015,493 L185,493" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#05-messages-arrow)"/><text x="600" y="471" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">MESSAGE_ACK</text><text x="600" y="517" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Sender state becomes delivered</text><rect x="845" y="536" width="340" height="57" rx="7" fill="#fff1d6"/><text x="1015" y="558" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Selected conversation marks message read</text><text x="1015" y="580" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">App/UI state, not proof of human comprehension</text><path d="M1015,667 L185,667" stroke="#557e70" stroke-width="2" fill="none"  marker-end="url(#05-messages-arrow)"/><text x="600" y="645" font-size="17" fill="#173b35" font-weight="600" text-anchor="middle">MESSAGE_READ</text><text x="600" y="691" font-size="14" fill="#63736b" font-weight="400" text-anchor="middle">Sender state becomes read</text><rect x="15" y="710" width="340" height="57" rx="7" fill="#fff1d6"/><text x="185" y="732" font-size="16" fill="#173b35" font-weight="600" text-anchor="middle">Retry queued messages on reconnect</text><text x="185" y="754" font-size="13" fill="#63736b" font-weight="400" text-anchor="middle">Lost ACK recovery differs between mobile and WPF</text><text x="32" y="781" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>