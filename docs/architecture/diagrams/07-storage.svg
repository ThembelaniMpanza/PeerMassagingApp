<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="07-storage-title 07-storage-desc"><title id="07-storage-title">07 / Persistence and trust boundaries</title><desc id="07-storage-desc">Encrypted transport content does not imply encrypted local message history.</desc><defs><marker id="07-storage-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#557e70"/></marker></defs><rect width="1200" height="680" rx="18" fill="#fcfbf7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="27" fill="#173b35" font-weight="700" text-anchor="start">07 / Persistence and trust boundaries</text><text x="32" y="73" font-size="16" fill="#63736b" font-weight="400" text-anchor="start">Encrypted transport content does not imply encrypted local message history.</text><rect x="35" y="115" width="530" height="155" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="53" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Mobile / protected small values</text><text x="53" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">SecureStore: stable profile</text><text x="53" y="200" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Trusted peers and base64 session keys</text><text x="53" y="225" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">OS-backed protection; not a message database</text><rect x="635" y="115" width="530" height="155" rx="14" fill="#e7f2ed" stroke="#9eb8ad"/><text x="653" y="146" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Windows / protected key bytes</text><text x="653" y="175" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">TrustedPeer.ProtectedKey in state.json</text><text x="653" y="200" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">ProtectedData with CurrentUser scope</text><text x="653" y="225" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Only session-key bytes receive DPAPI protection</text><rect x="35" y="315" width="530" height="190" rx="14" fill="#fff1d6" stroke="#9eb8ad"/><text x="53" y="346" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Mobile / plaintext local data</text><text x="53" y="375" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">AsyncStorage: messages and transfer metadata</text><text x="53" y="400" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">AsyncStorage: transfer ID → received URI</text><text x="53" y="425" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Documents/received: saved file bytes</text><text x="53" y="450" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">System share sheet exports user-selected files</text><rect x="635" y="315" width="530" height="190" rx="14" fill="#fff1d6" stroke="#9eb8ad"/><text x="653" y="346" font-size="20" fill="#173b35" font-weight="650" text-anchor="start">Windows / plaintext local data</text><text x="653" y="375" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">LocalAppData/IPMessenger/state.json</text><text x="653" y="400" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Messages, peers and transfer history</text><text x="653" y="425" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">LocalAppData/IPMessenger/Received: file bytes</text><text x="653" y="450" font-size="16" fill="#23433d" font-weight="400" text-anchor="start">Explorer action reveals the received file</text><text x="600" y="565" font-size="17" fill="#63736b" font-weight="400" text-anchor="middle">Electron prototype: localStorage also holds session keys without an OS-secret adapter</text><text x="600" y="603" font-size="17" fill="#63736b" font-weight="400" text-anchor="middle">Flutter prototype: SQLite peer_messages.db; independent data model</text><text x="32" y="662" font-size="12" fill="#7b857e" font-weight="400" text-anchor="start">IP Messenger • repository study • 22 September 2026</text></g></svg>